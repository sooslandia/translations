name: Handle pr changes

# Runs untrusted PR code, so it gets a read-only token and no secrets.
# The comment is posted by pr-comment.yml from the artifacts of this run.
on:
  pull_request:

jobs:
  handle-pr_changes:
    timeout-minutes: 2
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - name: Save pr info
      run: |
        mkdir pr-info
        echo '${{ github.event.pull_request.number }}' > pr-info/number
    - name: Upload pr info
      uses: actions/upload-artifact@v4
      with:
        name: 'pr-info'
        path: 'pr-info'
    - name: Checkout base
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.base.ref }}
        fetch-depth: '100'
        persist-credentials: false
    - name: Checkout pr
      uses: actions/checkout@v4
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.sha }}
        path: './pr'
        persist-credentials: false
    - name: Fetch base into pr
      run: |
        set -e
        cd pr
        git remote rename origin pr
        git remote add origin ..
        git fetch origin --depth=1
    - name: Run sltt
      id: 'sltt'
      uses: ./.github/actions/sltt
      with:
        projects_dir: './pr'
        sltt_arguments: "--mode pull_request"
        email_address: ${{ vars.EMAIL_ADDRESS }}
        base_commit_sha: ${{ github.event.pull_request.base.sha }}
        fail_on_errors: true
    - name: Extract current date
      run: |
        date '+CURRENT_DATE=%Y-%m-%d-%H-%M-%S' >> $GITHUB_ENV
    - name: Upload preview
      uses: actions/upload-artifact@v4
      with:
        name: 'preview-#${{ github.event.pull_request.number }}-${{ env.CURRENT_DATE }}'
        path: 'workspace/preview'
