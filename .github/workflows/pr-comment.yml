name: Comment on pr

# Does not check out or run PR code: artifacts of the PR run are treated as untrusted data.
on:
  workflow_run:
    workflows: ['Handle pr changes']
    types: [completed]

jobs:
  comment-on-pr:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - name: Checkout base
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Download pr artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: '{pr-info,sltt-errors}'
        path: 'pr-artifacts'
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}
    - name: Comment on PR
      uses: actions/github-script@v7
      with:
        script: |
          const script = require('./.github/workflows/comment-on-pr.js')
          await script({github, context, core})
